<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <title>Кейс — Aynur Akhmametov</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --accent: #8B1E2D;
      --text: #E8E0D4;
      --text-muted: #9a9a9a;
      --line: rgba(139, 30, 45, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 4vw 4rem;
    }
    .back {
      display: inline-block;
      margin-bottom: 2rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .back:hover { color: var(--text); }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }
    .sub {
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .actions { margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      padding: 0.65rem 1.25rem;
      border: 1px solid var(--accent);
      color: var(--text);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .file-list { list-style: none; border-top: 1px solid var(--line); }
    .file-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .file-name { font-size: 0.9rem; word-break: break-word; }
    .file-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .btn-sm { padding: 0.45rem 0.85rem; font-size: 0.65rem; }
    .loading, .error { color: var(--text-muted); padding: 2rem 0; }
    .error { color: #e07070; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Портфолио</a>
  <h1 id="case-title">…</h1>
  <p class="sub" id="case-cat"></p>
  <div class="actions">
    <button type="button" class="btn" id="btn-zip" hidden>Скачать все материалы</button>
  </div>
  <ul class="file-list" id="file-list"></ul>
  <p class="loading" id="status">Загрузка…</p>

  <script>
    const PUBLIC_KEY = 'https://disk.yandex.ru/d/Em9lTJpf1cYpPQ';
    const API = 'https://cloud-api.yandex.net/v1/disk/public/resources';

    const CASES = {
      alabuga: {
        title: { ru: 'Ребрендинг Алабуги', en: 'Alabuga Rebranding' },
        cat: { ru: 'SaaS-презентация', en: 'SaaS Presentation' },
        path: '/SAAS Анимация'
      },
      logo: {
        title: { ru: 'Анимация логотипа', en: 'Logo Animation' },
        cat: { ru: '9 вариантов', en: '9 Variants' },
        path: '/Анимация логотипа'
      },
      ads: {
        title: { ru: 'Рекламные креативы', en: 'Ad Creatives' },
        cat: { ru: 'Performance Ads', en: 'Performance Ads' },
        path: '/Креативы'
      },
      ai: {
        title: { ru: 'AI-продакшн', en: 'AI Production' },
        cat: { ru: 'ComfyUI + Kling', en: 'ComfyUI + Kling' },
        path: '/AI'
      },
      youtube: {
        title: { ru: 'Локализация YouTube', en: 'YouTube Localization' },
        cat: { ru: 'EN / ES / FR', en: 'EN / ES / FR' },
        path: '/Ролик на ютуб про города России'
      }
    };

    const params = new URLSearchParams(location.search);
    const caseId = params.get('case');
    const lang = localStorage.getItem('portfolio-lang') || 'ru';
    const caseMeta = CASES[caseId];
    const folderPath = caseMeta?.path || params.get('path') || '/';

    const titleEl = document.getElementById('case-title');
    const catEl = document.getElementById('case-cat');
    const listEl = document.getElementById('file-list');
    const statusEl = document.getElementById('status');
    const zipBtn = document.getElementById('btn-zip');

    if (caseMeta) {
      titleEl.textContent = caseMeta.title[lang] || caseMeta.title.ru;
      catEl.textContent = caseMeta.cat[lang] || caseMeta.cat.ru;
      document.title = (caseMeta.title[lang] || caseMeta.title.ru) + ' — Aynur Akhmametov';
    }

    function formatSize(bytes) {
      if (!bytes) return '';
      const mb = bytes / (1024 * 1024);
      return mb >= 1024 ? (mb / 1024).toFixed(1) + ' ГБ' : mb.toFixed(1) + ' МБ';
    }

    async function apiGet(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    }

    async function resolveDirectUrl(path) {
      const q = new URLSearchParams({ public_key: PUBLIC_KEY, path, fields: 'file,name,size' });
      const meta = await apiGet(`${API}?${q}`);
      if (!meta.file) throw new Error('no file');
      const res = await fetch(meta.file, { method: 'HEAD', redirect: 'follow' });
      if (!res.ok && res.status !== 206) throw new Error('redirect ' + res.status);
      return { url: res.url, name: meta.name };
    }

    function renderFileItem(item) {
      const li = document.createElement('li');
      const info = document.createElement('div');
      info.innerHTML = `<div class="file-name">${item.name}</div><div class="file-meta">${item.type === 'dir' ? 'Папка' : formatSize(item.size)}</div>`;

      if (item.type === 'file') {
        const dl = document.createElement('button');
        dl.type = 'button';
        dl.className = 'btn btn-sm';
        dl.textContent = 'Скачать';
        dl.addEventListener('click', async () => {
          dl.disabled = true;
          dl.textContent = '…';
          try {
            const { url, name } = await resolveDirectUrl(item.path);
            const a = document.createElement('a');
            a.href = url;
            a.download = name || item.name;
            a.rel = 'noopener';
            a.click();
            dl.textContent = 'Скачать';
          } catch {
            dl.textContent = 'Ошибка';
          } finally {
            dl.disabled = false;
          }
        });
        li.appendChild(info);
        li.appendChild(dl);
      } else {
        const sub = document.createElement('a');
        sub.className = 'btn btn-sm';
        sub.textContent = 'Открыть';
        sub.href = `folder.html?path=${encodeURIComponent(item.path)}`;
        li.appendChild(info);
        li.appendChild(sub);
      }

      listEl.appendChild(li);
    }

    async function loadFolder() {
      if (!caseMeta && !params.get('path')) {
        statusEl.className = 'error';
        statusEl.textContent = 'Кейс не найден.';
        return;
      }

      try {
        const q = new URLSearchParams({
          public_key: PUBLIC_KEY,
          path: folderPath,
          limit: '100',
          fields: 'name,type,_embedded.items.name,_embedded.items.path,_embedded.items.type,_embedded.items.size'
        });
        const data = await apiGet(`${API}?${q}`);

        if (!caseMeta) {
          titleEl.textContent = data.name || 'Материалы';
          catEl.textContent = '';
        }

        statusEl.hidden = true;

        if (data.type !== 'dir') return;

        zipBtn.hidden = false;
        zipBtn.addEventListener('click', async () => {
          zipBtn.disabled = true;
          zipBtn.textContent = 'Подготовка…';
          try {
            const dq = new URLSearchParams({ public_key: PUBLIC_KEY, path: folderPath });
            const dl = await apiGet(`${API}/download?${dq}`);
            const res = await fetch(dl.href, { method: 'HEAD', redirect: 'follow' });
            const a = document.createElement('a');
            a.href = res.url;
            a.rel = 'noopener';
            a.click();
            zipBtn.textContent = 'Скачать все материалы';
          } catch {
            zipBtn.textContent = 'Ошибка';
          } finally {
            zipBtn.disabled = false;
          }
        });

        const items = data._embedded?.items || [];
        if (!items.length) {
          listEl.innerHTML = '<li><div class="file-name">Материалы скоро появятся</div></li>';
          return;
        }

        items.forEach(renderFileItem);
      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = 'Не удалось загрузить материалы. Попробуйте позже.';
        console.warn(err);
      }
    }

    loadFolder();
  </script>
</body>
</html>
